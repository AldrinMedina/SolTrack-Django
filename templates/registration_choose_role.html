{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose role | SolTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* simplified, but keep the gradient/card vibe */
    body { background: linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { border-radius:20px; padding:2rem; width:520px; background: rgba(255,255,255,0.95); }
    .role-btn { width:100%; padding:1.2rem; margin-bottom:1rem; border-radius:12px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h3 class="mb-3">Create your account</h3>
    <p class="text-muted">Choose your role to start registration</p>

    <a href="{% url 'register_user_info' 'buyer' %}" class="btn btn-outline-primary role-btn">Buyer</a>
    <a href="{% url 'register_user_info' 'seller' %}" class="btn btn-outline-success role-btn">Seller</a>

    <hr>
    <div class="text-center">
      <a href="{% url 'login' %}">Already have an account? Sign in</a>
    </div>
  </div>
</body>
</html>
