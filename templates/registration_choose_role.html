{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose role | SolTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/register.css' %}">
  <style>
    /* simplified, but keep the gradient/card vibe */
    body { background: linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { border-radius:20px; padding:2rem; width:520px; background: rgba(255,255,255,0.95); }
    .role-btn { width:100%; padding:1.2rem; margin-bottom:1rem; border-radius:12px; font-weight:600; }
  </style>
</head>
<body>
  <div id="choose-role" class="page-content active">
    <div class="registration-card">
      <div class="logo">
        <h1>SolTrack</h1>
        <p class="subtitle">Blockchain-powered Vaccine Logistics</p>
      </div>

      <h2>Create Your Account</h2>
      <p class="subtitle">Select your role to begin registration</p>

      <!-- Buyer Button -->
      <a href="{% url 'register_user_info' 'buyer' %}" class="role-btn buyer">
        <div>
          <div style="font-size: 1.1rem; font-weight: 600;">Buyer</div>
          <div style="font-size: 0.85rem; color: #6b7280;">Procure and monitor vaccine shipments securely</div>
        </div>
      </a>

      <!-- Seller Button -->
      <a href="{% url 'register_user_info' 'seller' %}" class="role-btn seller">
        <div>
          <div style="font-size: 1.1rem; font-weight: 600;">Seller</div>
          <div style="font-size: 0.85rem; color: #6b7280;">Distribute vaccines with blockchain verification</div>
        </div>
      </a>

      <div class="divider">OR</div>

      <div class="text-center">
        <a href="{% url 'login' %}">Already have an account? Sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
