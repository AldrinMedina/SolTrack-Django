{# templates/dashboard/partials/shipment_logs.html #}
<div class="shipment-log-modal-content">
  <h5 class="modal-title">Shipment Log Report: Contract {{ contract.pk }}</h5>
    <hr>
    
    <div class="modal-body-content p-0" style="max-height: 50vh; overflow-y: auto;"> 
        
        <ul class="list-unstyled mb-0">
            {% for log in logs %}
            <li class="p-2 border-bottom" 
                style="font-size: 0.9rem;">
                
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="text-muted small">
                        {{ log.log_time|date:"Y-m-d H:i:s" }}
                    </span>
                    <span class="badge 
                        {% if log.log_type == 'Alert' %}bg-warning text-dark{% elif log.log_type == 'Critical' %}bg-danger{% elif log.log_type == 'Financial' or log.log_type == 'TX' %}bg-success{% else %}bg-primary{% endif %}" 
                        style="font-size: 0.7em;">
                        {{ log.log_type }}
                    </span>
                </div>
                
                <p class="mb-0">
                    {{ log.message }}
                </p>
            </li>
            {% empty %}
            <li class="text-center text-muted p-3">No activities logged for this shipment yet.</li>
            {% endfor %}
        </ul>
        
    </div>
</div>
