<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Verify your email</title>
  </head>
  <body style="font-family:Arial, sans-serif; color:#111;">
    <div style="max-width:600px; margin:0 auto; padding:20px;">
      <h2>Verify your SolTrack account</h2>
      <p>Hi {{ full_name }},</p>
      <p>Thanks for registering. Click the button below to verify your email address. This link will expire in 1 hour.</p>

      <p style="text-align:center; margin:30px 0;">
        <a href="{{ verify_link }}" style="background:#6366f1;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-block;">Verify My Email</a>
      </p>

      <p>If the button doesn't work, copy and paste this link into your browser:</p>
      <p><a href="{{ verify_link }}">{{ verify_link }}</a></p>

      <p>— {{ site_name }}</p>
    </div>
  </body>
</html>
