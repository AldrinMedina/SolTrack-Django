{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email Verification Sent | SolTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>
  <div class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="registration-card text-center">
      <h1 class="mb-3">📧 Email Sent</h1>
      <p class="subtitle mb-4">
        {% if email %}
            A verification link has been sent to <strong>{{ email }}</strong>.<br>
        {% else %}
            A verification link has been sent to your email.<br>
        {% endif %}
        Please check your inbox (and spam folder) to continue registration.
      </p>

      <a href="{% url 'choose_role' %}" class="btn btn-primary">
        Back to Registration
      </a>
    </div>
  </div>
</body>
</html>
